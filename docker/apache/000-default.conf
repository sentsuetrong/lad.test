# docker/apache/000-default.conf
# Apache Virtual Host Configuration

<VirtualHost *:80>
    ServerAdmin legal@health.moph.go.th
    DocumentRoot /var/www/html/public_html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Alias สำหรับ Dashboard ที่เป็น static files จาก Nuxt.js
    Alias /dashboard /var/www/html/public_html/dashboard

    # Alias สำหรับ Backend API ที่มาจาก CodeIgniter
    Alias /backend /var/www/html/public_html/backend

    <Directory /var/www/html/public_html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/public_html/backend>
        # Redirect all requests to the backend/index.php file
        # เพื่อให้ CodeIgniter จัดการ routing ได้
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>

    # Config สำหรับ PHP-FPM ถ้าจะใช้ (ใน Dockerfile ข้างบนใช้ mod_php)
    # หากใช้ PHP-FPM จะต้องติดตั้ง php-fpm และแก้ไขไฟล์นี้
    # เช่น SetHandler "proxy:fcgi://php_fpm_container:9000"
</VirtualHost>